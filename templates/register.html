{% extends 'base.html' %}
{% block title %}Register Employee — PharmaSys{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Register New Employee</h1>
  <a href="{{ url_for('employees') }}" class="btn btn-secondary">Back to Employees</a>
</div>

<div class="card" style="max-width:600px">
  <form method="POST">
    <div class="form-row">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" required placeholder="Full name"/>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required placeholder="Login username"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Minimum 6 characters"/>
      </div>
      <div class="form-group">
        <label>Role</label>
        <select name="role_id" required>
          {% for role in roles %}
          <option value="{{ role.role_id }}">{{ role.role_name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>License Number (optional)</label>
      <input type="text" name="license_number" placeholder="Professional license number"/>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create Account</button>
      <a href="{{ url_for('employees') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
