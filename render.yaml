services:
  - type: web
    name: kaak-pharmacy
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /data/pharmacy.db
    disk:
      name: pharmacy-data
      mountPath: /data
      sizeGB: 1
